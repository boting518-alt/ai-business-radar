[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-business-radar-schemas"
version = "0.1.0"
description = "Canonical domain and AI structured-output schemas for YouTube AI Business Radar"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ai_business_radar_schemas"]
